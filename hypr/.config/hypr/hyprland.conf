# Environment Variables
env = WLR_NO_HARDWARE_CURSORS,1
env = HYPRCURSOR_THEME,rose-pine-hyprcursor
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,rose-pine-hyprcursor
env = XCURSOR_SIZE,24
env = XDG_MENU_PREFIX=arch-

# Monitor Configuration
monitor = ,preferred,auto,auto

# Application Shortcuts
$terminal = ghostty
$fileManager = dolphin
$menu = wofi --show drun
$browser = google-chrome-stable

# Autostart Applications
exec-once = waybar &
exec-once = swww-daemon
exec-once = swayosd-server

# General Settings
general {
  gaps_in = 5
  gaps_out = 5
  border_size = 2
  col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
  col.inactive_border = rgba(595959aa)
  resize_on_border = true
  allow_tearing = false
  layout = dwindle
}

# Decoration Settings
decoration {
  rounding = 10
  active_opacity = 0.95
  inactive_opacity = 0.85
  shadow {
    enabled = true
    range = 4
    render_power = 3
    color = rgba(1a1a1aee)
  }
  blur {
    enabled = true
    size = 10
    passes = 2
    vibrancy = 0.1696
  }
}

# Animation Settings
animations {
  enabled = yes, please :)
  bezier = easeOutQuint,0.23,1,0.32,1
  bezier = easeInOutCubic,0.65,0.05,0.36,1
  bezier = linear,0,0,1,1
  bezier = almostLinear,0.5,0.5,0.75,1.0
  bezier = quick,0.15,0,0.1,1
  animation = global, 1, 10, default
  animation = border, 1, 5.39, easeOutQuint
  animation = windows, 1, 4.79, easeOutQuint
  animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
  animation = windowsOut, 1, 1.49, linear, popin 87%
  animation = fadeIn, 1, 1.73, almostLinear
  animation = fadeOut, 1, 1.46, almostLinear
  animation = fade, 1, 3.03, quick
  animation = layers, 1, 3.81, easeOutQuint
  animation = layersIn, 1, 4, easeOutQuint, fade
  animation = layersOut, 1, 1.5, linear, fade
  animation = fadeLayersIn, 1, 1.79, almostLinear
  animation = fadeLayersOut, 1, 1.39, almostLinear
  animation = workspaces, 1, 1.94, almostLinear, fade
  animation = workspacesIn, 1, 1.21, almostLinear, fade
  animation = workspacesOut, 1, 1.94, almostLinear, fade
}

# Dwindle Layout Settings
dwindle {
  preserve_split = true
}

# Master Layout Settings
master {
  new_status = master
}

# Miscellaneous Settings
misc {
  force_default_wallpaper = -1
  disable_hyprland_logo = false
}

# Input Settings
input {
  kb_layout = us
  kb_variant =
  kb_model =
  kb_options = ctrl:nocaps,altwin:swap_alt_win
  kb_rules =
  follow_mouse = 1
  sensitivity = -0.9
  natural_scroll = true
  touchpad {
    natural_scroll = true
  }
}

# Gesture Settings
# gesture = fingers, direction, action, options
# examples:
# gesture = 3, horizontal, workspace

# Device-Specific Settings
# device {
#   name =logitech-wireless-receiver-mouse
#   sensitivity = -0.5
# }

# Modifier Key
$mainMod = SUPER

# Keybindings
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
# bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod SHIFT, F, fullscreen
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, B, exec, $browser
bind = $mainMod, P, pseudo,
bind = $mainMod SHIFT, J, layoutmsg, togglesplit,
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bind = $mainMod, PRINT, exec, hyprshot -m region # mainmod + fn + ]
bind = $mainMod SHIFT, B, exec, ~/.config/waybar/launch.sh
bind = $mainMod SHIFT, P, exec, ~/.config/hypr/wallpaper.sh
bind = $mainMod SHIFT, L, exec, wlogout -b 2
 
# Mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Media Keys - Volume and Brightness
bindel = ,XF86AudioRaiseVolume,exec,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0%+
bindel = ,XF86AudioLowerVolume,exec,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0%-
bindel = ,XF86AudioMute,exec,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute,exec,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp,exec,brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown,exec,brightnessctl s 10%-

# Sway OSD
bindel = ,XF86AudioRaiseVolume,exec,swayosd-client --output-volume raise
bindel = ,XF86AudioLowerVolume,exec,swayosd-client --output-volume lower

# Media Keys - Playback Control
bindl = ,XF86AudioNext,exec,playerctl next
bindl = ,XF86AudioPause,exec,playerctl play-pause
bindl = ,XF86AudioPlay,exec,playerctl play-pause
bindl = ,XF86AudioPrev,exec,playerctl previous

# Window Rules
windowrule {
  name = stop-auto-maximize
  suppress_event = maximize
  match:class = .*
}
windowrule {
  name = xwayland-ghost-windows
  match:xwayland = 1
  match:class = ^$
  match:title = ^$
  no_initial_focus = on
  float = 1
  fullscreen = 0
  match:pin = 0
}

layerrule = blur on, match:namespace = waybar
layerrule = ignore_alpha 0.5, match:namespace waybar

layerrule = blur on, match:namespace wofi
layerrule = ignore_alpha 0.5, match:namespace wofi
